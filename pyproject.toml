[project]
name = "comfyui-prompt-batch-writer"
description = "Import, search and select prompts from a paginated library. Queue all rows, a range, checked rows or a seeded random sample in ComfyUI."
version = "0.2.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Loulan-prompt Authors" },
]
keywords = ["comfyui", "custom-node", "prompt", "batch", "queue"]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/update-loulan/comfyui-prompt-batch-writer"

[tool.comfy]
PublisherId = "update-loulan"
DisplayName = "Loulan-prompt"
Icon = ""
